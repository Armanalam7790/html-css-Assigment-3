<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="box">
            <h1>Feedback</h1>
            <p>How would be describe your mood after using product for the first timing ?</p>

            

            <div class="icon">
                    <p class="first">😊</p> <p>😊</p> <p>😊</p>
            </div>

            <div class="rate">
                <span>how would you rate the quality of our product</span>

                <div class="inner">
                    <p>1</p> <p>2</p> <p>3</p> <p class="four">4</p> <p>5</p>
                </div>
            </div>
            <div class="chechbox">
                    <p> wich feature is the best for you ? </p>
                   <div class="elem">
                    <input id="one" type="checkbox">
                    <label for="one">integration options and tools</label>
                   </div>
<!-- <br> -->
                    <div class="elem">
                        <input id="two" type="checkbox">
                    <label for="two">the advaced search functionality </label></div>
<!-- <br> -->
                   <div class="elem">
                     <input id="three" type="checkbox">
                    <label for="three">the customizablr settings</label>
                   </div>
            </div>



            <div class="feedback">
                    <h1>your feedback</h1>

                    <textarea name="" id=""></textarea>

            </div>

           <div class="btn">
             <button>send feedback</button>
           </div>
        </div>
    </main>
    
</body>
</html>
